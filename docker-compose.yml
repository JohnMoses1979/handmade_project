version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: handmade_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: handmade_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - handmade_network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend/seller
      dockerfile: Dockerfile
    container_name: handmade_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - handmade_network
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handmade_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - handmade_network
    ports:
      - "80:80"

volumes:
  mysql_data:
  backend_uploads:

networks:
  handmade_network:
    driver: bridge
